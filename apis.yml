aid: ctrl
name: Ctrl
description: >-
  Ctrl (Ctrl, Inc., a Delaware corporation) is an AI-powered workspace for
  revenue and sales teams that consolidates the tools and data a rep needs —
  CRM, email, calendar, and messaging — into a single actionable view. Founded
  in 2021 by Omri Sagzan and Aviv Nahum and based in Tel Aviv and London, Ctrl
  automates the manual work of updating records across apps such as HubSpot,
  Salesforce, Google Workspace, and Slack, and helps teams codify and replicate
  their winning sales playbooks. The company raised a $9M seed round led by
  LocalGlobe and Earlybird in 2023 and was acquired by Sana Labs in October 2024.
  Ctrl is a UI/workspace product surfaced as an Earlybird portfolio company; it
  publishes no public developer API, OpenAPI, or SDKs.
